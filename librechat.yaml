version: 1.2.8
cache: true

# LibreChat blocks MCP calls to private IPs by default (SSRF guard). Our MCP
# server runs on the host, reachable from the container as host.docker.internal.
mcpSettings:
  allowedAddresses:
    - "host.docker.internal:3001"

# The Postcard MCP server, over HTTP so it works from the LibreChat container.
# Run `npm run server` on the host first. Its nine tools query ClickHouse and
# Postgres directly.
mcpServers:
  postcard:
    type: streamable-http
    url: http://host.docker.internal:3001/mcp
    timeout: 60000

# Nebius Token Factory as an OpenAI-compatible endpoint (same key as .env).
endpoints:
  custom:
    - name: "Nebius"
      apiKey: "${NEBIUS_API_KEY}"
      baseURL: "https://api.tokenfactory.us-central1.nebius.com/v1"
      models:
        default:
          - "Qwen/Qwen3-30B-A3B-Instruct-2507"
          - "meta-llama/Llama-3.3-70B-Instruct"
        fetch: false
      titleConvo: true
      titleModel: "Qwen/Qwen3-30B-A3B-Instruct-2507"
      modelDisplayLabel: "Nebius"
  agents:
    disableBuilder: false
    capabilities: ["tools", "actions", "context"]

interface:
  modelSelect: true
  agents: true

# ── One-time setup in the LibreChat UI (http://chat.localhost:3081) ──
#
#   1. Register any email / password (registration is open).
#   2. Agents → Create.  Name: Amama.  Model: Nebius / Qwen3-30B-A3B-Instruct-2507.
#   3. Add Tools → the `postcard` group → all ten tools.
#   4. Paste docs/amama-agent.md as the Instructions. The wording matters — it
#      stops the model role-playing as Ruby instead of answering her.
#   5. Create, then select the Amama agent in chat (not the raw "Nebius" model).
#
# The finished agent is also exported to docs/amama-agent.json for reference.
