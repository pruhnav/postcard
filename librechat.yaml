version: 1.2.8
cache: true

# LibreChat blocks MCP calls to private IPs by default (SSRF guard). Our MCP
# server runs on the host, reachable from the container as host.docker.internal.
mcpSettings:
  allowedAddresses:
    - "host.docker.internal:3001"

# The Postcard MCP server, over HTTP so it works from the LibreChat container.
# Run `npm run server` on the host first. Its nine tools query ClickHouse and
# Postgres directly.
mcpServers:
  postcard:
    type: streamable-http
    url: http://host.docker.internal:3001/mcp
    timeout: 60000

# Nebius Token Factory as an OpenAI-compatible endpoint (same key as .env).
endpoints:
  custom:
    - name: "Nebius"
      apiKey: "${NEBIUS_API_KEY}"
      baseURL: "https://api.tokenfactory.us-central1.nebius.com/v1"
      models:
        default:
          - "Qwen/Qwen3-30B-A3B-Instruct-2507"
          - "meta-llama/Llama-3.3-70B-Instruct"
        fetch: false
      titleConvo: true
      titleModel: "Qwen/Qwen3-30B-A3B-Instruct-2507"
      modelDisplayLabel: "Nebius"
  agents:
    disableBuilder: false
    capabilities: ["tools", "actions", "context"]

interface:
  modelSelect: true
  agents: true

# ── One-time setup in the LibreChat UI (localhost:3080) ──────────────
#
# 1. Register any email/password (registration is open).
# 2. Agents  →  Create.
#      Name:   Amama
#      Model:  Nebius / Qwen3-30B-A3B-Instruct-2507
#      Tools:  add all nine `postcard` tools
#      Instructions:
#
#   You help Ruby keep track of her grandmother in Chennai, who talks to
#   Ruby's avatar most days.
#
#   Always use the tools; never guess. what_she_said_today for today,
#   search_her_words for anything older, day_summary for the kept summaries,
#   patterns for counts and trends, unknown_people for names nobody has
#   explained. extraction_log shows what the pipeline pulled out of recent
#   conversations and whether it reached the curated store. facts_to_confirm
#   lists auto-extracted facts still waiting on Ruby — when she says "yes,
#   that's right" call confirm_fact. teach_avatar when she says who someone is.
#
#   Answer in two or three sentences, lead with what Ruby would want first, and
#   if a number is unusual for her say what her normal is.
#
# 3. Save. It shows up in the console's right-hand panel.
