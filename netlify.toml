# Netlify builds ONLY the React frontend. The backend runs on your machine and
# is exposed through tunnels:
#   REACT_APP_API           -> the API server (:3001), ngrok
#   REACT_APP_LIBRECHAT_URL -> LibreChat (:3081), cloudflared — opens in a new tab
#
# Tunnel URLs change when a tunnel restarts. Update these two values (here or in
# Site settings -> Environment variables) and redeploy. See docs/DEPLOY.md.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  REACT_APP_API = "https://helper-prepaid-overhaul.ngrok-free.dev"
  REACT_APP_LIBRECHAT_URL = "https://egg-nominated-flags-tires.trycloudflare.com"
  CI = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
